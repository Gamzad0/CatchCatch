<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatchCatch 시작 화면</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: #222;
    }
    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }
    p {
      margin: 0;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    #reference,
    #shortcut {
      width: 240px;
      max-width: 100%;
      min-height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: 1px solid #777;
      border-radius: 4px;
      background: #eee;
      color: inherit;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    #reference {
      position: relative;
      height: 96px;
      align-items: flex-start;
      padding-top: 8px;
    }
    #reference::after {
      content: "+";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
      color: #c22;
    }
    #reference:hover,
    #shortcut:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <main>
    <p>
      이 페이지를 클릭해 활성화한 뒤 커서를 '보정 기준' 버튼의 빨간 + 중앙에 놓으세요.<br>
      보정 후 아래 버튼을 눌러 LMS로 이동하세요.
    </p>
    <button id="reference" type="button">보정 기준</button>
    <!-- 연결할 웹사이트 주소를 href에 입력하세요. 같은 탭에서 이동합니다. -->
    <a id="shortcut" href="https://eruri.kangwon.ac.kr/login/index.php"
       onclick="if (!this.getAttribute('href').trim()) event.preventDefault();">이루리 바로가기</a>
  </main>
</body>
</html>
